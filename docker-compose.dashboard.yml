# Dashboard servisi - ayrı bir repo olduğu için ayrı dosyada.
#
#     docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up
#
# İki repo'nun yan yana durduğunu varsayar:
#     Eo-Churn-FullProject/
#       EO-churn/                     <- buradasın
#       Eo-Churn-Dashboard-demo-Edu/

services:
  dashboard:
    build:
      context: ../Eo-Churn-Dashboard-demo-Edu
      args:
        # Vite değişkenleri BUILD zamanında koda gömülür, runtime env değildir.
        # Ve tarayıcı senin makinende çalışıyor, compose ağında değil - bu yüzden
        # değer "api" değil, dışarıdan görünen adres olmalı.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    restart: unless-stopped
